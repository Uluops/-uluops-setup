prompt = '''
# Aristotle Analyst v1
Performs Aristotelian four-cause decomposition on any artifact. Identifies material, formal, efficient, and final causes. Distinguishes essential from accidental properties. Decision TELEOLOGICAL/ATELEOLOGICAL.

## What's New in v1

| Feature | Description |
|---------|-------------|
| **Calibration Examples** | Reference scenarios for consistent scoring |
| **Failure Code Examples** | Worked examples mapping issues to taxonomy codes |
| **Token Budget** | Output length guidance |
| **Display IDs** | Auto-fail conditions have numbered IDs |

## Arguments

**Usage:** `/agents:aristotle-analyst <directory>`

**Examples:**
- `/agents:aristotle-analyst udl/adl/v3/code-validator.agent.yaml`
- `/agents:aristotle-analyst docs/architecture.md`
- `/agents:aristotle-analyst specs/api-spec.md`
- `/agents:aristotle-analyst agents/my-agent.md`

**Target Directory:** {{args}}


---

## Pre-Flight

```bash
echo "Running Aristotelian four-cause decomposition on {{args}}..."
echo "=============================================================="
```

Verify the target directory exists:

```bash
test -d "{{args}}" && echo "✓ Directory exists: {{args}}" || echo "ERROR: Directory '{{args}}' not found"
```

Enter and confirm location:

```bash
cd "{{args}}" && pwd
```

Check path exists:

```bash
[ -e "{{args}}" ] && echo "✓ {{args}} exists" || echo "Target file or directory does not exist"
```


---

## Agent Invocation

Run the Aristotle Analyst agent on the validated target directory:

**Agent:** aristotle-analyst-agent.md
**Model:** Opus
**Target:** {{args}}
**Run token:** if this command is running as a phase of a workflow or pipeline that is still executing in this same turn and has minted a run token, reuse that token. A token from an earlier, finished run in this conversation is never reused. Otherwise mint one now: generate the nonce with Bash — `openssl rand -hex 3` — and append it: `aristotle-analyst-<nonce>`. Never type the nonce yourself or reuse one you have seen. Check the token matches `^[a-z0-9][a-z0-9-]{2,63}$` before launching; a token that does not match is silently ignored and every row is lost. Remember the token, and the agentId the Agent tool result reports, for the tracker step.
**Prompt tag line:** Begin the agent prompt with `[agent:aristotle-analyst] [run:<token>]`, in that order. The agent-metrics hook reads both from the agent's first message: the name only from `[agent:]` (omitting it captures the metrics nameless), and the run token only from `[run:]` (omitting it drops the agent from the tracker collection).


---

## Auto-Fail Conditions

Critical issues that trigger immediate FAIL regardless of score:

| ID | Condition |
|----|-----------|
| **AF-001** | No genuine four-cause decomposition performed |
| **AF-002** | Efficient and final causes systematically conflated |
| **AF-003** | Telos is circular or tautological |
| **AF-004** | Essential and accidental properties not distinguished |
| **AF-005** | Generic analysis relabeled with Aristotelian terminology |

---

## Decision Thresholds

| Score | Decision | Meaning |
|-------|----------|---------|
| **>=70** | ✅ PASS | Validation passed, proceed to next phase |
| **<70** | ❌ FAIL | Validation failed, fix issues before proceeding |

**Note:** Any critical issue triggers FAIL regardless of score.

---

## Post-Flight Actions

### On Success

Artifact TELEOLOGICAL — means properly ordered toward ends

```bash
exit 0
```

### On Failure

Artifact ATELEOLOGICAL — telos incoherent or means disconnected from ends

```bash
exit 1
```


