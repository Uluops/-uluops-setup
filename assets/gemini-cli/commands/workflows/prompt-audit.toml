description = "Comprehensive prompt audit with ecosystem context. Prompt security analyst hard-gates against injection, jailbreak, and exfiltration patterns before quality passes run. Pattern analyzer provides ecosystem baseline, prompt engineer validates structure and scoring (median-of-3 when the score lands in a decision-boundary band), prompt quality validates clarity and effectiveness. Sequential with gating."
prompt = '''
# Prompt Audit

> Comprehensive prompt audit with ecosystem context. Prompt security analyst hard-gates against injection, jailbreak, and exfiltration patterns before quality passes run. Pattern analyzer provides ecosystem baseline, prompt engineer validates structure and scoring (median-of-3 when the score lands in a decision-boundary band), prompt quality validates clarity and effectiveness. Sequential with gating.

Duration: 8-18 minutes
**Arguments**: `file` (required)
## Pre-Flight Detection

- **is_agent_definition**: `grep -rqE --include='{{ file }}'  '^(name|description|type):' . 2>/dev/null`
- **is_agent_command**: `grep -rqE --include='{{ file }}'  'subagent_type|\[agent:' . 2>/dev/null`
## Execution

```
Group 1 (sequential): prompt-security
Group 2 (sequential): pattern-analyzer
Group 3 (sequential): prompt-engineer
Group 4 (sequential): prompt-quality
```
## Phases

**Run token:** before the first phase, mint one run token for the whole workflow — generate the nonce with Bash — `openssl rand -hex 3` — and append it: `prompt-audit-<nonce>`. Never type the nonce yourself or reuse one you have seen. Check the token matches `^[a-z0-9][a-z0-9-]{2,63}$` before launching; a token that does not match is silently ignored and every row is lost. If this workflow is running as a stage of a pipeline that is still executing in this same turn, reuse the pipeline's token instead; a token from an earlier, finished run in this conversation is never reused. Record the agentId each Agent tool result reports, paired with the agent name from the same call. Every agent launched in this workflow, directly or by a slash command, carries this one token.

**Agent launch protocol:** When a phase runs an agent directly via the Agent tool, begin the prompt with `[agent:<agent-name>] [run:<token>]` (lowercase kebab-case, in that order). The agent-metrics hook reads the name only from `[agent:]` and the run token only from `[run:]`: omitting `[agent:]` captures the agent nameless, and omitting `[run:]` drops it from the tracker collection. Phases that invoke slash commands get both from the command's own definition, which reuses this workflow's token instead of minting its own.

| # | Agent | Threshold | Gate | Condition |
|---|-------|-----------|------|-----------|
| 1 | prompt-security@latest | threshold >= 85, on fail: stop | stop | — |
| 2 | pattern-analyzer@latest | threshold >= 50, on fail: warn | stop | — |
| 3 | prompt-validate@latest | threshold >= 75, on fail: stop | stop | — |
| 4 | prompt-quality@latest | threshold >= 70, on fail: warn | stop | — |

**Prompt Security Scan**: Injection, jailbreak, and obfuscation patterns; Data exfiltration and malicious capability requests
**Ecosystem Pattern Analysis** (after prompt-security): Ecosystem scoring patterns and conventions; Decision vocabulary and threshold standards
**Prompt Engineering Validation** (after pattern-analyzer): Clarity, structure, and completeness; Scoring framework and effectiveness; MEDIAN-OF-3 PROTOCOL — SCORE: if the score lands in 67-78 or 82-88, run prompt-validate twice more as fresh invocations and let the MEDIAN of the three scores govern the gate and the tracker save; record all draws in the report. Outside the bands, single run governs.; MEDIAN-OF-3 PROTOCOL — AUTO-FAIL: an auto-fail is a SWITCH, not a score. It cannot be medianed and it overrides the score entirely, so the median settles nothing about it. Resolve it by MAJORITY of the draws' auto-fail verdicts (2 of 3), and record EVERY draw's disposition including a documented decline, so a 2-1 split stays visible rather than collapsing to one verdict. A majority-fired auto-fail sets the stage DECISION to the agent's negative token regardless of the median score, and is a RUN FAILURE, not a stop: set all_gates_passed false AND continue to the remaining phases — the downstream quality pass is an independent corroboration, and it is most valuable exactly when this phase trips. The numeric threshold still governs stop on its own.; MEDIAN-OF-3 PROTOCOL — FINDINGS: submit the DEDUPLICATED UNION of all draws' findings, not the median draw's set. The protocol constrains the score, never the finding set; draws that lose the median vote still surface real defects.
**Prompt Quality Validation** (after prompt-engineer): Clarity and specificity; Objective effectiveness criteria
## Scoring

**Method**: weighted_average
 — prompt-security: 20%, pattern-analyzer: 10%, prompt-engineer: 45%, prompt-quality: 25%
## Results Submission

Write markdown report to: `{{ target_path }}/{{ report_file }}`
Save ALL findings to tracker via `mcp_uluops-tracker_save_run` with project=`{{ target_name }}`, workflow_type=`prompt-audit`, definition_type=`workflow`, definition_name=`prompt-audit`, definition_version=`2.4.0`. Include agents array (name, score, decision) with every field of each `agent-metrics buffer list --run <token> -f tracker` entry spliced verbatim and unfiltered (rows selected by this workflow's run token, never by time; from what it returns, keep only rows whose `agent_id` matches an agentId reported by an Agent tool result from this invocation, and drop the rest — a reused or colliding token can return another run's rows, and a row you did not launch is never yours) — including definition_version, the version of that agent's own definition captured at spawn — and recommendations array (agent, title, priority, severity, description, file_path, line_number). Each file:line reference becomes a separate recommendation. Priority: blocking=critical, warnings=suggested, post-ship=backlog. The definition_version above is this workflow's; never copy it onto an agent. Per entry: if agent-metrics omitted an entry's definition_version, omit it on that entry — never type one, read it from the agent file, or move one between entries (same-name entries included). An agent with no agent-metrics row keeps its score and decision with no tokens, agent_id or definition_version. Never invent, copy or reuse an agent_id, and never drop or rename entries to clear a tracker warning. If a launched agentId has no matching row, a `[run:]` tag was dropped: recover it with `agent-metrics extract <agentId> -f tracker --agent-name <name>`, pairing the agentId with the name from the same Agent tool call — never an id whose launch you did not see. Apply the no-row rule only for an agent whose Agent tool result reported no agentId, and note the shortfall. Never widen the query (drop `--run`, add `--since`, list the whole buffer) to find a missing row.
After saving, query tracker and compare counts. Mismatches from cross-phase deduplication are expected — warn only, do not re-attempt.

