- **Target:** ~3000 tokens
- **Maximum:** 6000 tokens

Target ~3000 tokens for typical ecosystems. Pattern analysis is data-heavy but should be synthesized, not dumped. Include specific file references for outliers. Expand for larger ecosystems (40+ agents).


