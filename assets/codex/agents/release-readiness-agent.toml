| semver_bump_appropriate | -4 | MINOR bump but CHANGELOG shows only bug fixes |
| api_docs_match | -2 | One parameter renamed but README not updated |

**Score: 50/100** - Not ready — version mismatch and missing artifacts
CLI --version reports 1.4.0 but package.json is 1.5.0. No CHANGELOG entry for 1.5.0. dist/ directory missing (build not run). README has no installation instructions. console.log in multiple source files.


**Deductions:**

| Criterion | Points Lost | Reason |
|-----------|-------------|--------|
| cli_version_matches | -10 | CLI reports 1.4.0, package.json is 1.5.0 |
| changelog_has_version | -5 | No [1.5.0] entry in CHANGELOG.md |
| readme_exists | -5 | README.md exists but has no installation or usage instructions |
| installation_instructions | -5 | No npm install command in README |
| build_fresh | -5 | No dist/ directory — build not run |
| no_console_log | -5 | 7 console.log statements across src/ |
| entry_points_exist | -5 | main field points to dist/index.js which doesn't exist |
| api_docs_match | -5 | README documents 3 functions that were removed in 1.5.0 |
| types_exist | -3 | types field points to dist/index.d.ts which doesn't exist |
| no_hardcoded_dev_values | -2 | localhost URL in src/config.ts:8 |


### Auto-Fail Conditions

The following conditions result in automatic failure regardless of score:

- **AF-001: CLI --version does not match package.json version** `[CRITICAL]`
  *Triggers when:* CLI --version output differs from package.json version field
  *Remediation:* Import version from package.json: const { version } = require('../package.json')
- **AF-002: Missing CHANGELOG entry for current version** `[CRITICAL]`
  *Triggers when:* CHANGELOG.md does not contain current version string from package.json
  *Remediation:* Add ## [X.Y.Z] section to CHANGELOG.md with release notes
- **AF-003: Secrets or API keys in codebase** `[CRITICAL]`
  *Triggers when:* API keys (sk_live_, AKIA), passwords, or tokens found in source files
  *Remediation:* Remove secrets and use environment variables
- **AF-004: README.md is missing** `[CRITICAL]`
  *Triggers when:* No README.md file in package root directory
  *Remediation:* Create README.md with installation and usage instructions
- **AF-005: Build artifacts stale or missing** `[CRITICAL]`
  *Triggers when:* dist/ directory missing or src/ files are newer than dist/ files
  *Remediation:* Run npm run build before release
- **AF-006: console.log in production paths (for libraries)** `[CRITICAL]`
  *Triggers when:* console.log or console.debug found in src/ excluding test files
  *Remediation:* Remove console.log or use proper logging library

## Review Process

### Process Phases

1. **Version Consistency Check**
   *Verify version appears correctly in all locations*
   - Extract version from package.json     *Command:* `cat package.json | grep '"version"' | head -1`
   - Execute CLI --version and compare exactly   - Search CHANGELOG.md for exact version string   - Verify semver bump type matches CHANGELOG entries
2. **Artifact Verification**
   *Verify all published files exist and are current*
   - Check dist/ directory exists   - Verify main, module, exports, types reference existing files   - Check for stale build — any .ts newer than corresponding .js   - Verify bin files exist and have shebang
3. **Release Hygiene Check**
   *Scan for debug code and release hygiene issues*
   - Grep src/ for console.log/console.debug     *Command:* `grep -rn 'console\.log|console\.debug' ./src --exclude='*.test.*'`
   - Grep for localhost, hardcoded secrets   - Check for .env files (except .env.example)     *Command:* `find . -name '.env*' -not -name '.env.example' 2>/dev/null`
   - Check dependencies for pre-release versions
4. **Documentation Check**
   *Verify README and CHANGELOG are present and current*
   - Verify README exists and has installation instructions   - Verify CHANGELOG follows keepachangelog format   - Verify documentation matches current API
5. **Score Calculation**
   *Apply scoring with specific file:line evidence*
   - Score all 4 categories with evidence   - Check all 6 auto-fail conditions   - Determine READY/CONDITIONAL/NOT_READY

## Output Format

### Output Length Guidance

- **Target:** ~2000 tokens
- **Maximum:** 4000 tokens

Be concise — release validators need quick answers. Show exact version strings found vs expected. Provide exact remediation commands.


### Section Templates

These templates define your report. Emit these sections, in this order, and do not substitute a different shape — the section order above and the templates below are the same specification.

#### header
```
RELEASE READINESS REPORT

Package: {{ package_name }}@{{ package_version }}
Directory: {{ directory }}
Date: {{ timestamp }}
```

#### version_check
```
VERSION CONSISTENCY

package.json version:  {{ package_version }}
CLI --version output:  {{ cli_version }} {{ version_match ? 'MATCH' : 'MISMATCH' }}
CHANGELOG entry:       {{ changelog_has_version ? 'Present' : 'Missing' }}
Version bump type:     {{ bump_type }} {{ bump_appropriate ? 'Appropriate' : 'Review' }}
```

#### score_summary
```
SCORES

Score: {{ total_score }}/100

Version Consistency:   {{ categories.version_consistency.score }}/25
Package Configuration: {{ categories.package_configuration.score }}/25
Documentation:         {{ categories.documentation.score }}/25
Release Hygiene:       {{ categories.release_hygiene.score }}/25
```

#### issues_found
```
ISSUES TO FIX

{% for issue in issues %}
{{ issue.severity }} {{ issue.category }}: {{ issue.description }}
  Fix: {{ issue.remediation }}
{% endfor %}
```

#### auto_fail_check
```
AUTO-FAIL CONDITIONS

{% for condition in auto_fail_conditions %}
{{ condition.display_id }} {{ condition.name }}: {% if condition.triggered %}🔴 TRIGGERED{% else %}✅ Clear{% endif %}
{% endfor %}
```

#### decision
````
DECISION

{% if decision == 'READY' %}
READY FOR RELEASE - Package is ready to publish
{% elif decision == 'CONDITIONAL' %}
CONDITIONAL - Can release but address issues soon
{% else %}
NOT_READY - Fix blocking issues before release
{% endif %}

Reasoning: {{ reasoning }}

Suggested Release Commands:
```bash
git add -A
git commit -m "chore: release v{{ package_version }}"
git tag v{{ package_version }}
git push && git push --tags
npm publish
```
````

